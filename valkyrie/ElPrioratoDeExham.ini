description.Spanish=Inglaterra, agosto de 1923. El señor Delapore, descendiente de los De la Poer, ha restaurado el Priorato de Exham, la casa que su familia abandonó hace más de tres siglos. Desde entonces, algo corretea dentro de los muros, siempre hacia abajo, y solo él y los gatos parecen oírlo. Vosotros sois las cinco autoridades a las que ha llamado para averiguar qué hay bajo el priorato.\n\nCampaña de cinco escenarios, con prólogo, interludios y epílogo. Lo que ocurra cada noche os acompañará en la siguiente: las heridas, la locura, las guineas y todo lo que hayáis descubierto.\n\nManuales, hojas, fichas para imprimir y el relato «Las profundidades de Exham»: github.com/SrWilsonMoM/elprioratodeexham
